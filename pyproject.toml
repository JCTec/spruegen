[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spruegen"
version = "0.2.0"
description = "CLI: feeder interno + downstem (Ø10 x 35 mm) para un anillo STL, listo para resina casteable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "trimesh>=4.0",
  "manifold3d>=2.3",
  "numpy>=1.24",
  "pydantic>=2.5",
  "typer>=0.9",
  "rtree>=1.0",
  "scipy>=1.10",
  "shapely>=2.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
render = ["matplotlib>=3.7", "fast_simplification>=0.1"]
gui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "matplotlib>=3.7", "fast_simplification>=0.1"]

[project.scripts]
spruegen = "spruegen.cli:app"

[tool.setuptools]
packages = ["spruegen", "spruegen.gui"]

[tool.setuptools.package-data]
spruegen = ["presets/*.json", "gui/static/*", "gui/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests largos (showcase)"]
filterwarnings = ["ignore::RuntimeWarning:trimesh.triangles", "ignore::DeprecationWarning:fastapi.testclient"]
