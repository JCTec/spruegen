[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spruegen"
version = "0.3.0"
description = "Deterministic sprue-tree generator for lost-wax ring casting, backed by a cited alloy database"
license = {file = "LICENSE"}
authors = [{name = "Juan Carlos Estévez Rodríguez"}]
keywords = ["jewelry", "casting", "lost-wax", "sprue", "stl", "metallurgy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "trimesh>=4.0",
  "manifold3d>=2.3",
  "numpy>=1.24",
  "pydantic>=2.5",
  "typer>=0.9",
  "rtree>=1.0",
  "scipy>=1.10",
  "shapely>=2.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.5"]
render = ["matplotlib>=3.7", "fast_simplification>=0.1"]
gui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "matplotlib>=3.7", "fast_simplification>=0.1"]

[project.scripts]
spruegen = "spruegen.cli:app"

[project.urls]
Homepage = "https://github.com/JCTec/spruegen"

[tool.setuptools.packages.find]
include = ["spruegen*"]

[tool.setuptools.package-data]
"spruegen.config" = ["presets/*.json"]
"spruegen.materials" = ["data/*.json", "data/*.md"]
"spruegen.gui" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests largos (showcase)"]
filterwarnings = ["ignore::RuntimeWarning:trimesh.triangles", "ignore::DeprecationWarning:fastapi.testclient"]

[tool.ruff]
line-length = 120
target-version = "py311"
